appId: com.codeagent.app
productName: Code Agent
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

# 打包包含的内容：渲染产物、后端、主进程/预加载构建产物、依赖
files:
  - dist/**/*
  - out/**/*
  - server/**/*
  - package.json
  - node_modules/**/*

# asar 打包，但把后端与依赖解包到 app.asar.unpacked，
# 以便主进程 fork 出的子进程能正常加载 ESM server（asar 内不支持 ESM 动态加载）
asar: true
asarUnpack:
  - server/**/*
  - node_modules/**/*

win:
  target:
    - nsis
  # 跳过代码签名（未配置证书）：直接产出未签名安装包，
  # 用户安装时 SmartScreen 会提示未知发布者，点"仍要运行"即可。
  # 同时避免 electron-builder 去 GitHub 拉取 winCodeSign 二进制。
  sign: null
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  # 未配置 Apple Developer 证书与公证：生成的 dmg 仅供本机/信任设备自测，
  # 普通用户会被 Gatekeeper 拦截。配置 identity + 开启 notarize 后可正常分发。
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  # identity: null  # 自签名/无签名
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  title: ${productName} ${version}

# 自动更新暂不启用（electron-updater 可后续接入）
