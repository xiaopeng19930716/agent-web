appId: com.codeagent.app
productName: Code Agent
copyright: Copyright 漏 2026

directories:
  output: release
  buildResources: build

# 应用图标（Windows 用 icon.ico，Mac 用 icon.icns）；放 buildResources 下会被自动发现，这里显式指定更稳妥
icon: electron/build/icon.ico

# 鎵撳寘鍖呭惈鐨勫唴瀹癸細娓叉煋浜х墿銆佸悗绔€佷富杩涚▼/棰勫姞杞芥瀯寤轰骇鐗┿€佷緷璧?
# 娉ㄦ剰锛氫笉瑕佸啓 node_modules/**/*锛屽惁鍒欎細鎶?vite/electron 绛?devDependencies 鍏ㄦ墦杩?asar锛?
# 瀵艰嚧瀹夎鍖呭法澶с€佸畨瑁呰В鍘嬫瀬鎱€€俥lectron-builder 榛樿鍙墦鍖?dependencies 涓殑鐢熶骇渚濊禆銆?
# 只打包前端产物、主进程/预加载构建产物、以及已 bundle 好的后端单文件（out/server.mjs）。
# 注意：不再打包 server/**/* 与 node_modules/**/* —— 后端已用 esbuild 打成一个自包含文件，
# 运行时不再需要解包任何 node_modules，避免海量小文件拖慢启动。
files:
  - dist/**/*
  - out/**/*
  - package.json

# asar 鎵撳寘锛屼絾鎶婂悗绔笌渚濊禆瑙ｅ寘鍒?app.asar.unpacked锛?
# 浠ヤ究涓昏繘绋?fork 鍑虹殑瀛愯繘绋嬭兘姝ｅ父鍔犺浇 ESM server锛坅sar 鍐呬笉鏀寔 ESM 鍔ㄦ€佸姞杞斤級
asar: true
# 仅把后端 bundle 单文件（及其可能携带的资源）解包到 app.asar.unpacked，运行时不依赖 node_modules
asarUnpack:
  - out/server.mjs
  - out/assets/**/*

win:
  target:
    - nsis
  # 璺宠繃浠ｇ爜绛惧悕锛堟湭閰嶇疆璇佷功锛夛細鐩存帴浜у嚭鏈鍚嶅畨瑁呭寘锛?
  # 鐢ㄦ埛瀹夎鏃?SmartScreen 浼氭彁绀烘湭鐭ュ彂甯冭€咃紝鐐?浠嶈杩愯"鍗冲彲銆?
  # 鍚屾椂閬垮厤 electron-builder 鍘?GitHub 鎷夊彇 winCodeSign 浜岃繘鍒躲€?
  sign: null
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # 鑷畾涔夎剼鏈細榛樿灞曞紑"瀹夎缁嗚妭"绐楁牸锛屾樉绀哄疄鏃惰В鍘?澶嶅埗杩涘害
  include: build/installer.nsh
  # 使用默认 LZMA 压缩（useZip 在 electron-builder 25 上存在解压损坏/超时问题，弃用）
  displayLanguageSelector: false
  # 鍗歌浇鏃朵竴骞舵竻鐞嗙敤鎴锋暟鎹洰褰曪紙鎸夐渶锛岃皑鎱庯細浼氬垹闄や細璇濈瓑鏁版嵁锛?
  # deleteAppDataOnUninstall: true

mac:
  # 鏈厤缃?Apple Developer 璇佷功涓庡叕璇侊細鐢熸垚鐨?dmg 浠呬緵鏈満/淇′换璁惧鑷祴锛?
  # 鏅€氱敤鎴蜂細琚?Gatekeeper 鎷︽埅銆傞厤缃?identity + 寮€鍚?notarize 鍚庡彲姝ｅ父鍒嗗彂銆?
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  # identity: null  # 鑷鍚?鏃犵鍚?
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  title: ${productName} ${version}

# 鑷姩鏇存柊鏆備笉鍚敤锛坋lectron-updater 鍙悗缁帴鍏ワ級
